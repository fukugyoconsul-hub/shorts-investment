name: Render Test

# 動画作成の変更を本番投稿前に確かめるための手動実行専用ワークフロー。
# 台本生成からレンダリングまでを本番と同じ手順で行い、YouTubeへはアップロードせず、
# 完成した動画と台本・概要欄を成果物(artifact)として保存する。
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "扱うテーマ(空欄なら通常どおり自動で選ぶ)"
        default: ""
      category:
        description: "テーマのジャンル(topic指定時のみ使用。例: FX)"
        default: ""

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install headless Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libxkbcommon0 libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0

      - name: Reconstruct secret files
        run: |
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" >> .env
          echo '${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube-token.json

      - name: Start VOICEVOX engine
        run: |
          for i in 1 2 3; do docker pull voicevox/voicevox_engine:cpu-latest && break; sleep 10; done
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:50021/version; then echo; break; fi
            sleep 5
          done
          curl -sf http://127.0.0.1:50021/version

      - name: Build one video (no upload)
        env:
          FORCE_TOPIC_TITLE: ${{ inputs.topic }}
          FORCE_TOPIC_CATEGORY: ${{ inputs.category }}
        run: |
          node scripts/fetch-market-data.mjs
          node scripts/generate-script.mjs
          node scripts/match-main-video.mjs || true
          node scripts/generate-tts.mjs
          node scripts/auto-fetch-bg.mjs
          node scripts/select-bgm.mjs
          node scripts/write-segments.mjs
          node scripts/write-chart.mjs
          node scripts/write-description.mjs
          npx remotion render ShortsVideo out/final.mp4 --crf=18
          cp content/latest-script.json out/ && cp description.txt out/ && cp src/chart.ts out/

      - uses: actions/upload-artifact@v4
        with:
          name: render-test
          path: |
            out/final.mp4
            out/latest-script.json
            out/description.txt
            out/chart.ts
